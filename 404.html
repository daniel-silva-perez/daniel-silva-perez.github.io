<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Danny Silva | Personal Notebook</title>
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f7f3eb;
            --surface: #f0ead9;
            --text: #1c1714;
            --text-muted: #6b5e54;
            --accent: #c0603a;
            --border: #ddd5c4;
            --card-shadow: 0 2px 8px rgba(28,23,20,0.08);
            --heading-font: 'Lora', Georgia, serif;
            --heading-weight: 700;
            --heading-tracking: 0;
            --image-filter: none;
            --selection-bg: rgba(192,96,58,0.2);
            --nav-bg: rgba(247,243,235,0.92);
            --code-bg: #ede8df;
            --code-text: #1c1714;
            --scrollbar-thumb: #ddd5c4;
            --blockquote-border: #c0603a;
            --radius: 12px;
            --shadow-sm: 0 1px 3px rgba(28,23,20,0.06);
            --max-width: 1200px;
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #08080b;
            --surface: #111114;
            --text: #ebe6db;
            --text-muted: #888073;
            --accent: #f5a623;
            --border: rgba(255,255,255,0.06);
            --card-shadow: 0 0 0 1px rgba(255,255,255,0.05);
            --heading-font: 'Inter', sans-serif;
            --heading-weight: 300;
            --heading-tracking: -0.02em;
            --image-filter: saturate(0.8) brightness(0.92);
            --selection-bg: rgba(245,166,35,0.3);
            --nav-bg: rgba(8,8,11,0.8);
            --code-bg: #111114;
            --code-text: #f5a623;
            --scrollbar-thumb: rgba(255,255,255,0.1);
            --blockquote-border: #f5a623;
            --shadow-sm: 0 0 0 1px rgba(255,255,255,0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #08080b;
                --surface: #111114;
                --text: #ebe6db;
                --text-muted: #888073;
                --accent: #f5a623;
                --border: rgba(255,255,255,0.06);
                --card-shadow: 0 0 0 1px rgba(255,255,255,0.05);
                --heading-font: 'Inter', sans-serif;
                --heading-weight: 300;
                --heading-tracking: -0.02em;
                --image-filter: saturate(0.8) brightness(0.92);
                --selection-bg: rgba(245,166,35,0.3);
                --nav-bg: rgba(8,8,11,0.8);
                --code-bg: #111114;
                --code-text: #f5a623;
                --scrollbar-thumb: rgba(255,255,255,0.1);
                --blockquote-border: #f5a623;
                --shadow-sm: 0 0 0 1px rgba(255,255,255,0.05);
            }
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::selection { background: var(--selection-bg); color: var(--text); }

        h1, h2, h3, h4 {
            font-family: var(--heading-font);
            font-weight: var(--heading-weight);
            letter-spacing: var(--heading-tracking);
            line-height: 1.2;
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s var(--transition);
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 1rem 2rem;
            min-height: 72px;
            gap: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: var(--heading-font);
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .logo span { color: var(--accent); }

        nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        nav a {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s var(--transition);
        }

        nav a:hover { color: var(--text); }
        nav a:hover::after { width: 100%; }

        /* Theme Toggle */
        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            cursor: pointer;
            color: var(--text);
            display: flex;
            align-items: center;
            transition: border-color 0.2s, color 0.2s;
        }
        .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
        .theme-toggle .icon-moon { display: none; }
        [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
        [data-theme="dark"] .theme-toggle .icon-moon { display: block; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .theme-toggle .icon-sun { display: none; }
            :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: block; }
        }

        /* Error Content */
        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }

        .error-code {
            font-family: var(--heading-font);
            font-size: 10rem;
            font-weight: 800;
            line-height: 1;
            color: var(--accent);
            position: relative;
            margin-bottom: 1rem;
            animation: float 6s ease-in-out infinite;
            opacity: 0.8;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .error-visual {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 2rem auto;
        }

        .error-circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid var(--border);
        }

        .error-circle:nth-child(1) {
            width: 200px;
            height: 200px;
            top: 0;
            left: 0;
            border-color: var(--accent);
            opacity: 0.15;
            animation: pulse 3s ease-in-out infinite;
        }

        .error-circle:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 25px;
            left: 25px;
            border-color: var(--accent);
            opacity: 0.25;
            animation: pulse 3s ease-in-out infinite 0.5s;
        }

        .error-circle:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 50px;
            left: 50px;
            border-color: var(--accent);
            opacity: 0.35;
            animation: pulse 3s ease-in-out infinite 1s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: inherit; }
            50% { transform: scale(1.05); }
        }

        .error-face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
        }

        .error-title { font-size: 1.75rem; margin-bottom: 0.75rem; }

        .error-subtitle {
            font-size: 1.0625rem;
            color: var(--text-muted);
            max-width: 420px;
            margin: 0 auto 2rem;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 0.875rem 1.75rem;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 600;
            transition: all 0.25s var(--transition);
        }

        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            padding: 0.875rem 1.75rem;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 600;
            border: 1px solid var(--border);
            transition: all 0.25s var(--transition);
        }

        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 3rem 2rem;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin-bottom: 1.5rem;
        }

        .footer-links a { font-size: 0.9rem; color: var(--text-muted); transition: color 0.2s; }
        .footer-links a:hover { color: var(--text); }

        .footer-copyright { font-size: 0.875rem; color: var(--text-muted); }

        /* Responsive */
        @media (max-width: 768px) {
            .error-code { font-size: 6rem; }
            .error-actions { flex-direction: column; width: 100%; max-width: 280px; }
            nav { display: none; }
        }

        /* Respect reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="blog.html" class="logo">Danny<span>.</span></a>
            <nav>
                <a href="blog.html">Writing</a>
                <a href="archive.html">Archive</a>
                <a href="tags.html">Tags</a>
                <a href="about.html">About</a>
                <a href="index.html">Home</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="error-container">
        <div class="error-code">404</div>
        <div class="error-visual">
            <div class="error-circle"></div>
            <div class="error-circle"></div>
            <div class="error-circle"></div>
            <div class="error-face">&#x1F615;</div>
        </div>
        <h1 class="error-title">Page not found</h1>
        <p class="error-subtitle">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
        <div class="error-actions">
            <a href="blog.html" class="btn-primary">Back to Blog</a>
            <a href="index.html" class="btn-secondary">Go Home</a>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="blog.html">Writing</a>
            <a href="archive.html">Archive</a>
            <a href="tags.html">Tags</a>
            <a href="about.html">About</a>
            <a href="index.html">Home</a>
        </div>
        <p class="footer-copyright">&copy; 2026 Danny Silva. All rights reserved.</p>
    </footer>

    <script>
        // Theme toggle
        (function() {
            const root = document.documentElement;
            const saved = localStorage.getItem('theme');
            if (saved) root.setAttribute('data-theme', saved);
            document.getElementById('themeToggle')?.addEventListener('click', function() {
                const current = root.getAttribute('data-theme');
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                let next;
                if (!current) next = systemDark ? 'light' : 'dark';
                else if (current === 'dark') next = 'light';
                else next = 'dark';
                root.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            });
        })();
    </script>
</body>
</html>
