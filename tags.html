<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags — Minimal.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563EB;
            --primary-hover: #1d4ed8;
            --secondary: #6B7280;
            --accent: #1A1A1A;
            --surface: #FFFFFF;
            --background: #FAFAFA;
            --border: #E5E7EB;
            --radius: 12px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
            --max-width: 1200px;
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--accent);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.15;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s var(--transition);
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(250, 250, 250, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(229, 231, 235, 0.6);
        }

        .header-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 1.125rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--accent);
        }

        .logo span {
            color: var(--primary);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        nav a {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--secondary);
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s var(--transition);
        }

        nav a:hover {
            color: var(--accent);
        }

        nav a:hover::after {
            width: 100%;
        }

        nav a.active {
            color: var(--accent);
        }

        nav a.active::after {
            width: 100%;
        }

        .btn-subscribe {
            background: var(--primary);
            color: white;
            padding: 0.625rem 1.375rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.25s var(--transition);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }

        .btn-subscribe:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        /* Tags Hero */
        .tags-hero {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 5rem 2rem 3rem;
            text-align: center;
        }

        .tags-title {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .tags-subtitle {
            font-size: 1.25rem;
            color: var(--secondary);
            max-width: 480px;
            margin: 0 auto 2.5rem;
        }

        /* Search */
        .search-container {
            max-width: 480px;
            margin: 0 auto 3rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            border: 1px solid var(--border);
            border-radius: 100px;
            background: var(--surface);
            font-size: 0.9375rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s var(--transition);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
            pointer-events: none;
        }

        /* Tag Cloud */
        .tag-cloud {
            max-width: var(--max-width);
            margin: 0 auto 4rem;
            padding: 0 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.25s var(--transition);
            font-size: 0.9375rem;
            font-weight: 500;
        }

        .tag:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tag-count {
            font-size: 0.8125rem;
            padding: 0.125rem 0.5rem;
            border-radius: 100px;
            background: var(--background);
            color: var(--secondary);
            font-weight: 500;
        }

        .tag.active .tag-count {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Tag sizes based on popularity */
        .tag-size-1 { font-size: 0.875rem; }
        .tag-size-2 { font-size: 0.9375rem; }
        .tag-size-3 { font-size: 1.0625rem; }
        .tag-size-4 { font-size: 1.1875rem; }
        .tag-size-5 { font-size: 1.3125rem; }

        /* Color-coded tags */
        .tag-design { border-color: #dbeafe; }
        .tag-design:hover { background: #eff6ff; border-color: #3b82f6; color: #1e40af; }
        .tag-design.active { background: #3b82f6; border-color: #3b82f6; }

        .tag-engineering { border-color: #dcfce7; }
        .tag-engineering:hover { background: #f0fdf4; border-color: #22c55e; color: #166534; }
        .tag-engineering.active { background: #22c55e; border-color: #22c55e; }

        .tag-life { border-color: #fce7f3; }
        .tag-life:hover { background: #fdf2f8; border-color: #ec4899; color: #9d174d; }
        .tag-life.active { background: #ec4899; border-color: #ec4899; }

        .tag-travel { border-color: #fef3c7; }
        .tag-travel:hover { background: #fffbeb; border-color: #f59e0b; color: #92400e; }
        .tag-travel.active { background: #f59e0b; border-color: #f59e0b; }

        .tag-technology { border-color: #e0e7ff; }
        .tag-technology:hover { background: #eef2ff; border-color: #6366f1; color: #3730a3; }
        .tag-technology.active { background: #6366f1; border-color: #6366f1; }

        .tag-ai { border-color: #f3e8ff; }
        .tag-ai:hover { background: #faf5ff; border-color: #a855f7; color: #6b21a8; }
        .tag-ai.active { background: #a855f7; border-color: #a855f7; }

        .tag-productivity { border-color: #ccfbf1; }
        .tag-productivity:hover { background: #f0fdfa; border-color: #14b8a6; color: #0f766e; }
        .tag-productivity.active { background: #14b8a6; border-color: #14b8a6; }

        .tag-writing { border-color: #fee2e2; }
        .tag-writing:hover { background: #fef2f2; border-color: #ef4444; color: #991b1b; }
        .tag-writing.active { background: #ef4444; border-color: #ef4444; }

        .tag-career { border-color: #ffedd5; }
        .tag-career:hover { background: #fff7ed; border-color: #f97316; color: #9a3412; }
        .tag-career.active { background: #f97316; border-color: #f97316; }

        .tag-health { border-color: #d1fae5; }
        .tag-health:hover { background: #ecfdf5; border-color: #10b981; color: #065f46; }
        .tag-health.active { background: #10b981; border-color: #10b981; }

        /* Tagged Posts Section */
        .tagged-posts {
            max-width: var(--max-width);
            margin: 0 auto 5rem;
            padding: 0 2rem;
            display: none;
        }

        .tagged-posts.visible {
            display: block;
        }

        .tagged-posts-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .tagged-posts-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .tagged-post-card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s var(--transition);
        }

        .tagged-post-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .tagged-post-image {
            height: 180px;
            overflow: hidden;
        }

        .tagged-post-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s var(--transition);
        }

        .tagged-post-card:hover .tagged-post-image img {
            transform: scale(1.05);
        }

        .tagged-post-content {
            padding: 1.25rem;
        }

        .tagged-post-category {
            display: inline-block;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
        }

        .tagged-post-title {
            font-size: 1.0625rem;
            line-height: 1.35;
            margin-bottom: 0.5rem;
        }

        .tagged-post-meta {
            font-size: 0.8125rem;
            color: var(--secondary);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 3rem 2rem;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin-bottom: 1.5rem;
        }

        .footer-links a {
            font-size: 0.9rem;
            color: var(--secondary);
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .footer-copyright {
            font-size: 0.875rem;
            color: var(--secondary);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .tagged-posts-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .tags-title {
                font-size: 2.5rem;
            }

            .tag-cloud {
                gap: 0.75rem;
            }

            .tag {
                padding: 0.625rem 1rem;
            }

            .tagged-posts-list {
                grid-template-columns: 1fr;
            }

            nav {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="blog.html" class="logo">Minimal<span>.</span></a>
            <nav>
                <a href="blog.html">Blog</a>
                <a href="archive.html">Archive</a>
                <a href="tags.html" class="active">Tags</a>
                <a href="about.html">About</a>
                <a href="index.html">Portfolio</a>
            </nav>
            <a href="blog.html#newsletter" class="btn-subscribe">Subscribe</a>
        </div>
    </header>

    <section class="tags-hero">
        <h1 class="tags-title">Tags</h1>
        <p class="tags-subtitle">Browse topics and discover articles that interest you.</p>
        <div class="search-container">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" class="search-input" id="tagSearch" placeholder="Search tags...">
        </div>
    </section>

    <section class="tag-cloud" id="tagCloud">
        <button class="tag tag-size-5 tag-engineering" data-tag="Engineering" onclick="filterByTag(this)">
            Engineering
            <span class="tag-count">18</span>
        </button>
        <button class="tag tag-size-4 tag-technology" data-tag="Technology" onclick="filterByTag(this)">
            Technology
            <span class="tag-count">15</span>
        </button>
        <button class="tag tag-size-3 tag-design" data-tag="Design" onclick="filterByTag(this)">
            Design
            <span class="tag-count">12</span>
        </button>
        <button class="tag tag-size-3 tag-writing" data-tag="Writing" onclick="filterByTag(this)">
            Writing
            <span class="tag-count">11</span>
        </button>
        <button class="tag tag-size-2 tag-ai" data-tag="AI" onclick="filterByTag(this)">
            AI
            <span class="tag-count">9</span>
        </button>
        <button class="tag tag-size-2 tag-life" data-tag="Life" onclick="filterByTag(this)">
            Life
            <span class="tag-count">8</span>
        </button>
        <button class="tag tag-size-2 tag-productivity" data-tag="Productivity" onclick="filterByTag(this)">
            Productivity
            <span class="tag-count">7</span>
        </button>
        <button class="tag tag-size-1 tag-career" data-tag="Career" onclick="filterByTag(this)">
            Career
            <span class="tag-count">6</span>
        </button>
        <button class="tag tag-size-1 tag-travel" data-tag="Travel" onclick="filterByTag(this)">
            Travel
            <span class="tag-count">5</span>
        </button>
        <button class="tag tag-size-1 tag-health" data-tag="Health" onclick="filterByTag(this)">
            Health
            <span class="tag-count">4</span>
        </button>
    </section>

    <section class="tagged-posts" id="taggedPosts">
        <h2 class="tagged-posts-title" id="taggedPostsTitle">Posts tagged with <span id="activeTagName"></span></h2>
        <div class="tagged-posts-list" id="taggedPostsList"></div>
    </section>

    <footer>
        <div class="footer-links">
            <a href="blog.html">Blog</a>
            <a href="archive.html">Archive</a>
            <a href="tags.html">Tags</a>
            <a href="about.html">About</a>
            <a href="index.html">Portfolio</a>
        </div>
        <p class="footer-copyright"> 2024 Minimal. All rights reserved.</p>
    </footer>

    <script>
        // Tag data
        const postsByTag = {
            'Engineering': [
                { title: 'Building Resilient Systems with Rust', category: 'Engineering', date: 'Dec 10, 2024', image: 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&q=80' },
                { title: 'TypeScript Design Patterns for Large Applications', category: 'Engineering', date: 'Nov 22, 2024', image: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600&q=80' },
                { title: 'Optimizing Database Queries at Scale', category: 'Engineering', date: 'Nov 5, 2024', image: 'https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=600&q=80' }
            ],
            'Technology': [
                { title: 'The Future of AI-Assisted Development', category: 'Technology', date: 'Dec 5, 2024', image: 'https://images.unsplash.com/photo-1677442136019-21780ecad995?w=600&q=80' },
                { title: 'WebAssembly: Beyond the Browser', category: 'Technology', date: 'Nov 18, 2024', image: 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&q=80' },
                { title: 'Edge Computing Explained', category: 'Technology', date: 'Nov 1, 2024', image: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600&q=80' }
            ],
            'Design': [
                { title: 'Design Systems at Scale', category: 'Design', date: 'Nov 20, 2024', image: 'https://images.unsplash.com/photo-1558655146-9f40138edfeb?w=600&q=80' },
                { title: 'The Psychology of Color in UI', category: 'Design', date: 'Oct 28, 2024', image: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=600&q=80' },
                { title: 'Micro-interactions That Delight', category: 'Design', date: 'Oct 15, 2024', image: 'https://images.unsplash.com/photo-1561070791-2526d30994b5?w=600&q=80' }
            ],
            'Life': [
                { title: 'The Art of Slow Living', category: 'Life', date: 'Dec 15, 2024', image: 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=600&q=80' },
                { title: 'Morning Routines That Actually Work', category: 'Life', date: 'Nov 28, 2024', image: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80' },
                { title: 'Digital Detox: A Week Without Screens', category: 'Life', date: 'Oct 20, 2024', image: 'https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=600&q=80' }
            ],
            'Productivity': [
                { title: 'Deep Work in a Distracted World', category: 'Productivity', date: 'Nov 8, 2024', image: 'https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?w=600&q=80' },
                { title: 'The Second Brain Method', category: 'Productivity', date: 'Oct 25, 2024', image: 'https://images.unsplash.com/photo-1506784365847-bbad939e9335?w=600&q=80' },
                { title: 'Time Blocking for Creative Work', category: 'Productivity', date: 'Oct 10, 2024', image: 'https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=600&q=80' }
            ],
            'Travel': [
                { title: 'Finding Solitude in the Mountains', category: 'Travel', date: 'Nov 15, 2024', image: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600&q=80' },
                { title: 'A Month in Tokyo', category: 'Travel', date: 'Sep 22, 2024', image: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=600&q=80' },
                { title: 'Hiking the Pacific Crest Trail', category: 'Travel', date: 'Sep 5, 2024', image: 'https://images.unsplash.com/photo-1551632811-561732d1e306?w=600&q=80' }
            ]
        };

        let activeTag = null;

        function filterByTag(element) {
            const tag = element.dataset.tag;
            const postsSection = document.getElementById('taggedPosts');
            const postsList = document.getElementById('taggedPostsList');
            const activeTagName = document.getElementById('activeTagName');

            // Toggle active state
            document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));

            if (activeTag === tag) {
                activeTag = null;
                postsSection.classList.remove('visible');
                return;
            }

            activeTag = tag;
            element.classList.add('active');

            // Show posts
            const posts = postsByTag[tag] || [];
            activeTagName.textContent = tag;
            postsList.innerHTML = posts.map(post => `
                <article class="tagged-post-card" onclick="location.href='post.html'">
                    <div class="tagged-post-image">
                        <img src="${post.image}" alt="${post.title}">
                    </div>
                    <div class="tagged-post-content">
                        <span class="tagged-post-category">${post.category}</span>
                        <h3 class="tagged-post-title">${post.title}</h3>
                        <div class="tagged-post-meta">${post.date}</div>
                    </div>
                </article>
            `).join('');

            postsSection.classList.add('visible');
            postsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Search filter
        document.getElementById('tagSearch').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('.tag').forEach(tag => {
                const tagName = tag.dataset.tag.toLowerCase();
                if (tagName.includes(query)) {
                    tag.style.display = 'inline-flex';
                } else {
                    tag.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
